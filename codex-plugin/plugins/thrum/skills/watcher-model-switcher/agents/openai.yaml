interface:
  display_name: "Watcher: Model Switcher"
  short_description: "Use when a watcher agent must fix a dropped or wrong model/effort pin, or when a coordinator must set a deliberate model/effort override, by driving Claude Code's /model and /effort TUI selectors over thrum tmux - correcting a model pin, correcting an effort pin, fixing a tier drift, setting a deliberate override, switching model or effort on a live agent's pane. Loads the recognize-then-actuate procedure, the confirm-modal and effort-reset hazards, the pin_override protocol, and the fail-loud-on-unrecognized-pane rule."
  default_prompt: "Use when a watcher agent must fix a dropped or wrong model/effort pin, or when a coordinator must set a deliberate model/effort override, by driving Claude Code's /model and /effort TUI selectors over thrum tmux - correcting a model pin, correcting an effort pin, fixing a tier drift, setting a deliberate override, switching model or effort on a live agent's pane. Loads the recognize-then-actuate procedure, the confirm-modal and effort-reset hazards, the pin_override protocol, and the fail-loud-on-unrecognized-pane rule."
