interface:
  display_name: "Project Hotpath Gate"
  short_description: "Use when a project needs its hot-path gate configuration established or updated - the canonical config at .thrum/hotpath-gate.json defining trigger directories, subprocess patterns, lock patterns, shared resources, reference patterns, and incident prose for the coordinator-hotpath-merge-gate skill. First invocation generates from project inspection; subsequent invocations reconcile against current project state and propose diffs."
