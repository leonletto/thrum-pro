interface:
  display_name: "Third Party Audit Opencode"
  short_description: "Use when you want an INDEPENDENT audit of a claim, finding, defect, or review verdict - a second opinion from outside the Claude family, a third-party verification, an adversarial check on a P0/P1 filing, or a cheap way to re-verify something before acting on it. Launches a disposable opencode agent in its own worktree, has it write a findings artifact, preserves that artifact to dev-docs, then tears down the agent, its state directory, and the worktree. Also use when review token spend is a concern - the audit runs on a non-Anthropic model and costs cents."
  default_prompt: "Use when you want an INDEPENDENT audit of a claim, finding, defect, or review verdict - a second opinion from outside the Claude family, a third-party verification, an adversarial check on a P0/P1 filing, or a cheap way to re-verify something before acting on it. Launches a disposable opencode agent in its own worktree, has it write a findings artifact, preserves that artifact to dev-docs, then tears down the agent, its state directory, and the worktree. Also use when review token spend is a concern - the audit runs on a non-Anthropic model and costs cents."
