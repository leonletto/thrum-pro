interface:
  display_name: "Coordinator Assessing Agent Completion"
  short_description: "Use when deciding which live agents are FINISHED and can be stood down - finding obsolete agents, idle agents, agents nobody is waiting on, agents still running after their work landed, reaping candidates, tidying up the fleet, 'who can I shut down', 'which agents are done', or auditing a box before a deploy or restart. Produces a candidate list from the transcript record plus a blocker check, never a kill list."
  default_prompt: "Use when deciding which live agents are FINISHED and can be stood down - finding obsolete agents, idle agents, agents nobody is waiting on, agents still running after their work landed, reaping candidates, tidying up the fleet, 'who can I shut down', 'which agents are done', or auditing a box before a deploy or restart. Produces a candidate list from the transcript record plus a blocker check, never a kill list."
