interface:
  display_name: "Diagnosing Fleet And Daemon"
  short_description: "Use when the daemon or fleet looks broken and you need to find something FAST — daemon down, daemon not running, connection refused, dial unix, thrum.sock, socket refused, daemon crashed, daemon wedged, daemon hangs, fleet dark, fleet outage, agents unreachable, can't send, send failed, messages not delivering, no agents responding, daemon status wrong, daemon won't start, restart the daemon, is the daemon alive, where is the daemon log, which log file, searching logs, hooklog query, command log, jq returned nothing, empty log search, agent looks dead, agent stale, last_seen stale, is this agent alive, schema mismatch, cannot downgrade, migration on restart, SIGBUS, WAL poison, 522, database locked. Also use BEFORE restarting any daemon — the pre-restart migration check lives here."
