interface:
  display_name: "Thrum: Fixing Documentation Errors"
  short_description: "Use the moment you notice documentation is wrong, stale, incomplete, or contradicts what a command actually does - a doc that omits a flag or subcommand that exists, a README/llms.txt/CLI-help/docstring/comment that disagrees with observed behaviour, a version-stamped section that predates a feature, an example that would fail if run, a doc claim you were about to cite and could not confirm. Illustrative (non-exhaustive) triggers - 'the docs don't mention X', 'llms.txt is out of date', 'the help text says Y but it actually does Z', 'that flag isn't documented', 'this example is wrong', 'the docs are stale here', 'I should file a bead about the docs', 'I'll note the doc gap' - but the trigger is NOTICING A DOC DEFECT, not matching a phrase. Fires regardless of what you were originally doing; a doc error found mid-task is still in scope."
  default_prompt: "Use the moment you notice documentation is wrong, stale, incomplete, or contradicts what a command actually does - a doc that omits a flag or subcommand that exists, a README/llms.txt/CLI-help/docstring/comment that disagrees with observed behaviour, a version-stamped section that predates a feature, an example that would fail if run, a doc claim you were about to cite and could not confirm. Illustrative (non-exhaustive) triggers - 'the docs don't mention X', 'llms.txt is out of date', 'the help text says Y but it actually does Z', 'that flag isn't documented', 'this example is wrong', 'the docs are stale here', 'I should file a bead about the docs', 'I'll note the doc gap' - but the trigger is NOTICING A DOC DEFECT, not matching a phrase. Fires regardless of what you were originally doing; a doc error found mid-task is still in scope."
