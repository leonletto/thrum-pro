interface:
  display_name: "Thrum: Recover Agent State"
  short_description: "Use after suspected scheduled-agent crash, when state.md may be partial / malformed / unparseable - validates structure BEFORE writing, preserves corrupt content to state.md.broken, and routes the daemon-side corruption flow (sets the auto-respawn gate flag plus pages the operator). Also handles soft-recovery - when state.md parses cleanly but is missing the prior wake's entry (mid-wake kill), reconstructs that entry from the prior session's restart snapshot via the thrum agent state update command."
  default_prompt: "Use after suspected scheduled-agent crash, when state.md may be partial / malformed / unparseable - validates structure BEFORE writing, preserves corrupt content to state.md.broken, and routes the daemon-side corruption flow (sets the auto-respawn gate flag plus pages the operator). Also handles soft-recovery - when state.md parses cleanly but is missing the prior wake's entry (mid-wake kill), reconstructs that entry from the prior session's restart snapshot via the thrum agent state update command."
