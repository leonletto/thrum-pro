name: Publish OpenCode plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check package version
        id: version-check
        working-directory: opencode-plugin
        run: |
          local_version=$(node -p "require('./package.json').version")
          if npm view "opencode-thrum-pro@${local_version}" version --silent 2>/dev/null | grep -q "^${local_version}$"; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test, and publish
        if: steps.version-check.outputs.should_publish == 'true'
        working-directory: opencode-plugin
        run: npm ci && npm test && npm publish --access public
