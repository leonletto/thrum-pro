interface:
  display_name: "Coordinator Interacting With The Owner"
  short_description: "Use whenever you are about to write to the pane for the human, or are deciding whether something warrants it - a thrum notification just arrived, an agent reported completion or a finding, you are about to narrate status or explain a decision, you are about to escalate something to the owner, or you are composing a thrum send/reply, bd create/update, or memory write whose body has prose in it. Also use before restarting on a context reading. Symptoms - a notification triggers a multi-paragraph reply meant for nobody, a report to the owner feels satisfying to write, a quick single-line command feels faster than a heredoc, or a context percentage has not been re-measured since it was first noticed."
  default_prompt: "Use whenever you are about to write to the pane for the human, or are deciding whether something warrants it - a thrum notification just arrived, an agent reported completion or a finding, you are about to narrate status or explain a decision, you are about to escalate something to the owner, or you are composing a thrum send/reply, bd create/update, or memory write whose body has prose in it. Also use before restarting on a context reading. Symptoms - a notification triggers a multi-paragraph reply meant for nobody, a report to the owner feels satisfying to write, a quick single-line command feels faster than a heredoc, or a context percentage has not been re-measured since it was first noticed."
