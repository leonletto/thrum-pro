interface:
  display_name: "Coordinator Full Gate"
  short_description: "Use when running or dispatching the full gate suite — the periodic full-gate cadence (the daily or on-demand whole-tree gate), an agent run on the dedicated thrum-perf-test isolation box. Not a per-merge step and not a single make-gate command. Fires on - about to run the full gate, the scheduled or daily full-gate fire, an on-demand whole-tree gate, the full-gate-test-history cadence, a release-prep full gate, driving trunk toward green. A scoped merge is verified by coordinator-hotpath-merge-gate + coordinator-philosophy-merge-gate + a changed-package build-and-race, and must never trigger this."
  default_prompt: "Use when running or dispatching the full gate suite — the periodic full-gate cadence (the daily or on-demand whole-tree gate), an agent run on the dedicated thrum-perf-test isolation box. Not a per-merge step and not a single make-gate command. Fires on - about to run the full gate, the scheduled or daily full-gate fire, an on-demand whole-tree gate, the full-gate-test-history cadence, a release-prep full gate, driving trunk toward green. A scoped merge is verified by coordinator-hotpath-merge-gate + coordinator-philosophy-merge-gate + a changed-package build-and-race, and must never trigger this."
