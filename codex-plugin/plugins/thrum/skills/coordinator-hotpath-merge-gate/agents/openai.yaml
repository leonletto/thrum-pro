interface:
  display_name: "Coordinator: Hot-Path Merge Gate"
  short_description: "Use when ABOUT TO START a hot-path Pass-3 gate - a gate has been dispatched to you, you are picking up a queued gate, you are the Gate Runner beginning a gate, you are about to walk hot-path lenses - and when a coordinator is about to run git merge after dual review came back clean. Loads the gate-runner restart rule (restart at ~50 percent, at a seam BETWEEN gates) plus the 10 hot-path and perf lenses read from .thrum/hotpath-gate.json. Skip only on a mechanical zero-match against the configured trigger directories, paired with a firing positive control. For branches touching RPC handlers, projection writers, storage openers, sync code, peer dial paths, or daemon boot paths - not CLI helpers, tests-only, docs, or website."
  default_prompt: "Use when ABOUT TO START a hot-path Pass-3 gate - a gate has been dispatched to you, you are picking up a queued gate, you are the Gate Runner beginning a gate, you are about to walk hot-path lenses - and when a coordinator is about to run git merge after dual review came back clean. Loads the gate-runner restart rule (restart at ~50 percent, at a seam BETWEEN gates) plus the 10 hot-path and perf lenses read from .thrum/hotpath-gate.json. Skip only on a mechanical zero-match against the configured trigger directories, paired with a firing positive control. For branches touching RPC handlers, projection writers, storage openers, sync code, peer dial paths, or daemon boot paths - not CLI helpers, tests-only, docs, or website."
