interface:
  display_name: "Thrum: Plugin Update"
  short_description: "Use when changing, adding, reviewing or shipping ANY plugin skill, command, agent or hook - editing a SKILL.md, writing a new skill, fixing a skill description, running scripts/sync-skills.sh, updating the runtime plugin on a box, refreshing or reinstalling the plugin marketplace, or during any fleet deploy where agents must pick up new skills. Covers the mandatory plugin version increment (an edit is INVISIBLE to installed agents until the version moves), the YAML frontmatter rules that decide whether a skill is discoverable at all, how to verify a skill actually triggers, and how to check what is really installed versus what is merged."
  default_prompt: "Use when changing, adding, reviewing or shipping ANY plugin skill, command, agent or hook - editing a SKILL.md, writing a new skill, fixing a skill description, running scripts/sync-skills.sh, updating the runtime plugin on a box, refreshing or reinstalling the plugin marketplace, or during any fleet deploy where agents must pick up new skills. Covers the mandatory plugin version increment (an edit is INVISIBLE to installed agents until the version moves), the YAML frontmatter rules that decide whether a skill is discoverable at all, how to verify a skill actually triggers, and how to check what is really installed versus what is merged."
