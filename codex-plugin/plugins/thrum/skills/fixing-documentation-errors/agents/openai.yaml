interface:
  display_name: "Thrum: Fixing Documentation Errors"
  short_description: "Use the moment you notice docs are wrong, stale, or incomplete - a missing flag, a help text or llms.txt that disagrees with behaviour, a broken example. Triggers include 'the docs don't mention X', 'llms.txt is out of date', 'this example is wrong'."
