interface:
  display_name: "Using The Queue"
  short_description: "Use when an agent tracks its own committed work or needs to see who is doing what - keeping a task list of what you are working on, recording work someone assigned you, promoting a backlog bead or issue into active work, lifting an assignment out of a message you received, routing work to another agent, checking what another agent has on its plate, or moving a task through pending / in_progress / blocked / done. Also use when you reach a lull, go idle, or finish a thread and are about to conclude 'nothing pending' - reconcile your committed work against the queue before deciding you are done. Covers the full thrum queue CLI - bundles, embedded items, status, assignment provenance, and reading another agent's queue."
  default_prompt: "Use when an agent tracks its own committed work or needs to see who is doing what - keeping a task list of what you are working on, recording work someone assigned you, promoting a backlog bead or issue into active work, lifting an assignment out of a message you received, routing work to another agent, checking what another agent has on its plate, or moving a task through pending / in_progress / blocked / done. Also use when you reach a lull, go idle, or finish a thread and are about to conclude 'nothing pending' - reconcile your committed work against the queue before deciding you are done. Covers the full thrum queue CLI - bundles, embedded items, status, assignment provenance, and reading another agent's queue."
